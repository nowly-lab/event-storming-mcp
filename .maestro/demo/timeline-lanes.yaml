# Demo: timeline phases — domains as lanes, phases as columns; a new event lands in its phase.
# Local stack (from the PR's worktree):
#   npm install && npm run build
#   export EVENT_STORMING_MCP_DATA_DIR=$(mktemp -d) EVENT_STORMING_MCP_BROWSER=none
#   a git repo with test/model/fixtures/timeline copied to docs-model and origin https://example.com/acme/shop.git, then
#   node dist/cli.js render <repo>/docs-model && node dist/cli.js add <repo>/docs-model   # project slug: shop-ddfa4c
#   export MAESTRO_ESM_URL=$(node dist/cli.js serve --no-open)
#   node .maestro/demo/agent.mjs $MAESTRO_ESM_URL &      # the "Claude" side, on 127.0.0.1:8798
#   python3 <implementation>/scripts/demo-video/demo_take.py web .maestro/demo/timeline-lanes.yaml <out> --points 1440x900 --window-title ライブボード
url: ${MAESTRO_ESM_URL}/#/shop-ddfa4c/big-picture.html
---
- launchApp
- extendedWaitUntil:
    visible: "仕入れを決めた"
    timeout: 60000
- tapOn: "全体"
# Lead-in so the recording starts before the first action.
- extendedWaitUntil:
    visible: "この文字は出ません"
    timeout: 9000
    optional: true
- extendedWaitUntil:
    visible: "経費に計上した"
    timeout: 3000
    label: "区切りを左から右に"
- evalScript:
    script: "${http.post('http://127.0.0.1:8798/add?project=shop-ddfa4c&after=decided&type=event&text=' + encodeURIComponent('仕入れを見直した'), { body: '' }).body}"
    label: "Claude がイベントを足す"
- extendedWaitUntil:
    visible: "仕入れを見直した"
    timeout: 5000
    label: "同じ区切りの列に入る"
- extendedWaitUntil:
    visible: "この文字も出ません"
    timeout: 4000
    optional: true
