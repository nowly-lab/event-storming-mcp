# Demo: what changed since the board was opened stays on the big picture, listed with who changed it; ここから比べ直す resets it.
# Local stack (from the PR's worktree):
#   npm install && npm run build
#   export EVENT_STORMING_MCP_DATA_DIR=$(mktemp -d) EVENT_STORMING_MCP_BROWSER=none
#   a git repo with test/model/fixtures/sample copied to docs-model and origin https://example.com/acme/shop.git, then
#   node dist/cli.js render <repo>/docs-model && node dist/cli.js add <repo>/docs-model   # project slug: shop-ddfa4c
#   export MAESTRO_ESM_URL=$(node dist/cli.js serve --no-open)
#   node .maestro/demo/agent.mjs $MAESTRO_ESM_URL &      # the "Claude" side, on 127.0.0.1:8798
#   python3 <implementation>/scripts/demo-video/demo_take.py web .maestro/demo/session-diff.yaml <out> --points 1440x900 --window-title ライブボード
url: ${MAESTRO_ESM_URL}/#/shop-ddfa4c/big-picture.html
---
- launchApp
- extendedWaitUntil:
    visible: "まだ変更はありません"
    timeout: 60000
# Zoom the board so the stickies read in the video.
- tapOn: "＋"
- tapOn: "＋"
- tapOn: "＋"
- tapOn: "＋"
# Lead-in so the recording starts before the first action.
- extendedWaitUntil:
    visible: "この文字は出ません"
    timeout: 9000
    optional: true
- evalScript:
    script: "${http.post('http://127.0.0.1:8798/apply?project=shop-ddfa4c&id=priced&text=' + encodeURIComponent('相場を3社から取得した'), { body: '' }).body}"
    label: "Claude が付箋を直す"
- extendedWaitUntil:
    visible: "このセッションの変更 \\(1\\)"
    timeout: 5000
    label: "枠と札が残る"
- evalScript:
    script: "${http.post('http://127.0.0.1:8798/add?project=shop-ddfa4c&after=priced&type=hotspot&text=' + encodeURIComponent('送料はどこまで含める？'), { body: '' }).body}"
    label: "疑問の付箋を足す"
- extendedWaitUntil:
    visible: "このセッションの変更 \\(3\\)"
    timeout: 5000
    label: "誰が何を変えたか一覧"
- extendedWaitUntil:
    visible: "この文字も出ません"
    timeout: 4000
    optional: true
- tapOn:
    text: "ここから比べ直す"
    label: "ここから比べ直す"
- extendedWaitUntil:
    visible: "まだ変更はありません"
    timeout: 5000
- extendedWaitUntil:
    visible: "この文字も出ません"
    timeout: 2000
    optional: true
